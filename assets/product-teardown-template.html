<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品拆解报告</title>
<style>
:root{--bg:#f3f1eb;--paper:#fffefa;--ink:#1c1e1a;--muted:#676a63;--line:#d6d2c8;--dark:#242721;--accent:#a12468;--confirmed:#17663e;--inferred:#24698e;--recommended:#814b91;--unknown:#92610b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Inter,"PingFang SC","Microsoft YaHei",sans-serif}header{padding:42px max(20px,calc((100vw - 1400px)/2));background:var(--dark);color:#fff;border-bottom:5px solid var(--accent)}h1{font-size:36px;margin:8px 0 12px}main{max-width:1400px;margin:auto;padding:28px 18px 80px}section{margin:0 0 42px}h2{font-size:24px;border-bottom:2px solid var(--ink);padding-bottom:8px}.badge{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:3px 8px;margin:2px 5px 2px 0;font-size:11px}.confirmed{color:var(--confirmed)}.inferred{color:var(--inferred)}.recommended{color:var(--recommended)}.unknown{color:var(--unknown)}.panel{background:var(--paper);border:1px solid var(--line);padding:15px}.table-wrap{overflow:auto;border:1px solid var(--line);background:var(--paper)}table{border-collapse:collapse;width:100%;min-width:1100px;font-size:12px}th{position:sticky;top:0;background:var(--dark);color:#fff;text-align:left;padding:9px}td{vertical-align:top;padding:9px;border-bottom:1px solid var(--line)}tr:nth-child(even) td{background:#faf9f6}@media(max-width:800px){h1{font-size:29px}}
</style>
</head>
<body>
<header>
  <span class="badge confirmed">已确认</span><span class="badge inferred">合理推断</span><span class="badge recommended">建议设计</span><span class="badge unknown">未知</span>
  <h1>产品拆解报告</h1>
  <p>替换为产品类型、拆解范围和核心路径。</p>
</header>
<main>
  <section><h2>执行摘要</h2><div class="panel">写入一句话架构总结、产品类型和最关键发现。</div></section>
  <section><h2>证据范围与缺口</h2><div class="panel">写入证据来源、编号、版本、时间和不可确认事项。</div></section>
  <section><h2>用户层</h2><div class="panel">写入用户目标、旅程、决策、情绪、痛点和功能域。</div></section>
  <section><h2>技术层</h2><div class="panel">写入应用、Agent 或工作流、工具、状态、资产和基础设施。</div></section>
  <section><h2>模型层</h2><div class="panel">写入已确认模型、能力、限制、路由和未知项。</div></section>
  <section><h2>数据层</h2><div class="panel">写入实体、上下文、版本、引用、生产者和消费者。</div></section>
  <section><h2>As-Is 与 To-Be</h2><div class="panel">分开呈现当前架构和建议架构。</div></section>
  <section><h2>风险、证据追溯与下一步</h2><div class="panel">写入风险优先级、证据链接、未知事项和补证计划。</div></section>
</main>
</body>
</html>
